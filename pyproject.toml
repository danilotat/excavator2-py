[build-system]
requires = ["scikit-build-core==0.11.6", "pybind11==3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "excavator2"
version = "0.1.0.dev0"
description = "Python-first EXCAVATOR2 port with focused C++ numerical kernels (scaffold)"
readme = "docs/development.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "PyYAML>=6,<7",
    "pysam>=0.22,<1",
    "pyBigWig>=0.3.22,<1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
excavator2 = "excavator2.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
wheel.packages = ["src/excavator2"]
sdist.include = ["src/**", "cpp/**", "tests/**", "docs/**", "CMakeLists.txt", "LICENSE", "tools/oracle/**", "tools/convert_legacy.py"]
sdist.exclude = ["*.local.md", ".test/**", "excavator2/**", ".venv/**", "dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
