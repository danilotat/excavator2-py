[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "cmake>=3.20"]
build-backend = "scikit_build_core.build"

[project]
name = "excavator2"
version = "3.0.0"
description = "CNV detection from whole-exome sequencing data - Python/C++ rewrite"
readme = "README.md"
license = {text = "GPLv3"}
authors = [
    {name = "Romina D'Aurizio", email = "romina.daurizio@gmail.com"},
    {name = "Alberto Magi"},
    {name = "EXCAVATOR2 Python/C++ Rewrite Team"}
]
requires-python = ">=3.9"
keywords = ["bioinformatics", "CNV", "genomics", "exome-sequencing", "copy-number-variants"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.20,<2.0",
    "scipy>=1.7",
    "pandas>=1.3",
    "h5py>=3.0",
    "pysam>=0.20",
    "pyBigWig>=0.3",
    "pyyaml>=6.0",
    "click>=8.0",
    "matplotlib>=3.4",
    "seaborn>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=1.0",
]

[project.scripts]
excavator2 = "excavator2.cli.main:cli"

[project.urls]
Homepage = "https://github.com/ctglab/excavator2-py"
Documentation = "https://excavator2.readthedocs.io"
Repository = "https://github.com/ctglab/excavator2-py"
"Bug Tracker" = "https://github.com/ctglab/excavator2-py/issues"
Original = "https://github.com/ctglab/excavator2"

[tool.scikit-build]
cmake.minimum-version = "3.20"
cmake.build-type = "Release"
wheel.packages = ["src/excavator2"]

[tool.scikit-build.cmake.define]
PYBIND11_FINDPYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=excavator2 --cov-report=html --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Will enable gradually
ignore_missing_imports = true

[tool.coverage.run]
source = ["excavator2"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
