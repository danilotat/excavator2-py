name: Lint

on:
  push:
    branches: [main, rewriting, dev/*]
  pull_request:
    branches: [main, rewriting]

jobs:
  ruff:
    name: Ruff linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff>=0.1

      - name: Run Ruff
        run: ruff check src/ tests/
