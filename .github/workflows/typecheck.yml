name: Type Check

on:
  push:
    branches: [main, rewriting, dev/*]
  pull_request:
    branches: [main, rewriting]

jobs:
  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mypy>=1.0
          pip install numpy scipy pandas h5py pyyaml click matplotlib seaborn types-PyYAML

      - name: Run mypy
        run: mypy src/excavator2/ --ignore-missing-imports
